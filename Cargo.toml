[package]
name = "snd"
version = "0.1.5"
edition = "2024"
description = "Quick scp to configured servers"
authors = ["nick22985"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "6"
glob = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
